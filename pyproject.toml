[project]
name = "vireceipt"
version = "0.1.0"
description = "Vietnamese receipt extraction with verified output and measured abstention"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.22,<5",
]

[project.scripts]
vireceipt-eval = "vireceipt.eval.cli:main"
vireceipt-freeze = "vireceipt.eval.lock:main"
vireceipt-check-labels = "vireceipt.checks:main"
vireceipt-split = "vireceipt.split:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vireceipt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
